[package]
name = "platers-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
description = "Core plate solving library for astronomical astrometry"

[dependencies]
rayon = { workspace = true }
serde = { workspace = true }
tracing = { workspace = true }

# File I/O
parquet = "53"
arrow = "53"

# FITS I/O and WCS transforms
fitsy = "0.1.3"

# Spatial indexing and astronomy libraries
kiddo = "4.2"
cdshealpix = "0.7"

# mmap'd, pre-sorted quad index (flatindex)
memmap2 = "0.9"
bytemuck = { version = "1", features = ["derive"] }

[dev-dependencies]
approx = "0.5"
# examples/solve_from_json reads the detected-star list as JSON
serde_json = { workspace = true }

[lints]
workspace = true
